name: Sync from friend's fork

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:      # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and merge friend's main
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add friend https://github.com/skoteskote/bodyofwork.git
          git fetch friend main
          git merge friend/main --no-edit || echo "Nothing to merge or conflict detected"

      - name: Push if updated
        run: git push origin main
